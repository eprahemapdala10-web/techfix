    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .logo-icon {
      width: 40px; height: 40px; border-radius: 10px;

    }
    .logo-text { font-weight: 800; font-size: 15px; line-height: 1; }

      background: transparent; color: var(--text-muted);
      font-size: 13px; font-weight: 600; transition: all .2s;
    }
    .nav-btn.active, .nav-btn:hover { background: rgba(249,115,22,0.15); color: var(--orange); }
    .nav-cta {
      padding: 10px 18px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: #fff; font-size: 13px; font-weight: 700;
      box-shadow: 0 4px 20px rgba(249,115,22,0.3);
      white-space: nowrap; transition: transform .2s;
    }
    .nav-cta:hover { transform: translateY(-1px); }

    /* ── SECTIONS ── */
    .section { display: none; }
    .section.active { display: block; }

    /* ── HERO ── */
    .hero {
      text-align: center; padding: 80px 20px 60px;
      position: relative; overflow: hidden;
    }
    .hero-glow {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(249,115,22,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block; padding: 6px 18px; border-radius: 20px;
      background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.2);
      color: var(--orange); font-size: 13px; margin-bottom: 24px; font-weight: 600;
    }
    .hero h1 {
      font-size: clamp(32px, 5vw, 56px); font-weight: 900;
      margin-bottom: 20px; line-height: 1.3;
    }
    .hero h1 span {
      background: linear-gradient(135deg, var(--orange), #fbbf24);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p { font-size: 18px; color: var(--text-muted); max-width: 520px; margin: 0 auto 36px; line-height: 1.8; }

    .btn-primary {

    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary {

      background: rgba(255,255,255,0.06); color: #fff;
      border: 1px solid rgba(255,255,255,0.12);

    .stat-num { font-size: 28px; font-weight: 900; color: var(--orange); }
