<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Fix | مركز صيانة البوتجازات وسخانات الغاز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        html { scroll-behavior: smooth; font-family: 'Cairo', sans-serif; }
        body { font-family: 'Cairo', sans-serif; background-color: #0d0d1e; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d0d1e; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-100 min-h-screen selection:bg-orange-500 selection:text-slate-950">

    <div id="maintenance-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#16162a] border border-white/10 w-full max-w-xl rounded-3xl p-6 md:p-8 relative shadow-2xl">
            <button onclick="toggleModal('maintenance-modal')" class="absolute top-4 left-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            
            <div class="mb-6">
                <div class="flex justify-between mb-4 relative">
                    <div class="absolute top-4 left-0 right-0 h-0.5 bg-white/10 -z-10"></div>
                    <div id="step-dots" class="flex justify-between w-full">
                        </div>
                </div>
                <div class="h-1 bg-white/10 rounded-full overflow-hidden">
                    <div id="step-progress-line" class="h-full bg-gradient-to-r from-orange-500 to-orange-600 transition-all duration-300 w-0"></div>
                </div>
            </div>

            <div id="form-step-0" class="form-step">
                <h3 class="text-xl font-bold text-center mb-6">ما هو الجهاز المُراد صيانته؟</h3>
                <div class="flex gap-4">
                    <button onclick="setFormValue('deviceType', 'بوتجاز'); moveStep(1);" id="card-dev-بوتجاز" class="choice-card flex-1 bg-white/5 border border-white/10 p-6 rounded-2xl flex flex-col items-center gap-3 transition-all hover:border-orange-500/50">
                        <span class="text-4xl">🍳</span>
                        <span class="font-bold">بوتجاز</span>
                    </button>
                    <button onclick="setFormValue('deviceType', 'سخان غاز'); moveStep(1);" id="card-dev-سخان" class="choice-card flex-1 bg-white/5 border border-white/10 p-6 rounded-2xl flex flex-col items-center gap-3 transition-all hover:border-orange-500/50">
                        <span class="text-4xl">🚿</span>
                        <span class="font-bold">سخان غاز</span>
                    </button>
                </div>
            </div>

            <div id="form-step-1" class="form-step hidden">
                <h3 class="text-xl font-bold text-center mb-6">نوع الخدمة المطلوبة</h3>
                <div class="flex flex-col gap-3">
                    <button onclick="setFormValue('serviceType', 'صيانة جهاز حالي'); moveStep(1);" id="card-serv-1" class="service-option-card text-right p-4 bg-white/5 border border-white/10 rounded-xl flex items-center gap-4 transition-all">
                        <span class="text-3xl">🔧</span>
                        <div>
                            <div class="font-bold">صيانة جهاز حالي</div>
                            <div class="text-xs text-slate-400 mt-0.5">إصلاح مشكلة في جهازك الحالي بالمنزل</div>
                        </div>
                    </button>
                    <button onclick="setFormValue('serviceType', 'توصيل وتثبيت جهاز جديد'); moveStep(1);" id="card-serv-2" class="service-option-card text-right p-4 bg-white/5 border border-white/10 rounded-xl flex items-center gap-4 transition-all">
                        <span class="text-3xl">📦</span>
                        <div>
                            <div class="font-bold">توصيل وتثبيت جهاز جديد</div>
                            <div class="text-xs text-slate-400 mt-0.5">تركيب وضبط جهاز جديد بأعلى معايير الأمان</div>
                        </div>
                    </button>
                    <button onclick="setFormValue('serviceType', 'تجديد شامل لجهاز قديم'); moveStep(1);" id="card-serv-3" class="service-option-card text-right p-4 bg-white/5 border border-white/10 rounded-xl flex items-center gap-4 transition-all">
                        <span class="text-3xl">✨</span>
                        <div>
                            <div class="font-bold">تجديد شامل لجهاز قديم</div>
                            <div class="text-xs text-slate-400 mt-0.5">عمرة صيانة كاملة وتجديد مظهر الهيكل الخارجي</div>
                        </div>
                    </button>
                </div>
            </div>

            <div id="form-step-2" class="form-step hidden">
                <h3 class="text-xl font-bold text-center mb-4">تفاصيل الجهاز والعطل</h3>
                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-2">الماركة <span class="text-orange-500">*</span></label>
                    <select id="form-brand-select" onchange="setFormValue('brand', this.value)" class="w-full bg-[#1a1a32] border border-white/10 p-3 rounded-xl text-white outline-none focus:border-orange-500">
                        <option value="" disabled selected>اختر الماركة...</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-2">المشكلة الشائعة <span class="text-orange-500">*</span></label>
                    <div id="problems-badges-container" class="flex flex-wrap gap-2 mb-3">
                        </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-2">أو اكتب وصف مخصص للمشكلة</label>
                    <textarea id="form-custom-problem" oninput="setFormValue('customProblem', this.value)" placeholder="اشرح المشكلة بالتفصيل هنا..." rows="3" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-orange-500 resize-none"></textarea>
                </div>
            </div>

            <div id="form-step-3" class="form-step hidden">
                <h3 class="text-xl font-bold text-center mb-6">بيانات التواصل والزيارة</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">الاسم الكامل <span class="text-orange-500">*</span></label>
                        <input type="text" id="form-name" oninput="setFormValue('name', this.value)" placeholder="اكتب اسمك الثلاثي" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">رقم الهاتف <span class="text-orange-500">*</span></label>
                        <input type="tel" id="form-phone" oninput="setFormValue('phone', this.value)" placeholder="01xxxxxxxxx" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">العنوان التفصيلي <span class="text-orange-500">*</span></label>
                        <input type="text" id="form-address" oninput="setFormValue('address', this.value)" placeholder="الشارع، العمارة، الدور، الشقة" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">المحافظة <span class="text-orange-500">*</span></label>
                        <select id="form-city-select" onchange="setFormValue('city', this.value)" class="w-full bg-[#1a1a32] border border-white/10 p-3 rounded-xl text-white outline-none focus:border-orange
